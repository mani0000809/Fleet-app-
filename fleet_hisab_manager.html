<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.json" />
  <title>Mor self drive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding-bottom: 80px; }
    header { background: #0f172a; color: #fff; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 14px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .dark-card { background: #0f172a; color: #fff; border-color: #0f172a; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { border: none; border-radius: 10px; padding: 11px 12px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-amber { background: #f59e0b; color: #0f172a; }
    .btn-green { background: #059669; color: #fff; }
    .btn-red { background: #dc2626; color: #fff; }
    .btn-dark { background: #0f172a; color: #fff; }
    .btn-light { background: #e2e8f0; color: #0f172a; }
    .full { width: 100%; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #475569; }
    .field input, .field select { width: 100%; padding: 10px; border: 1px solid #94a3b8; border-radius: 8px; font-size: 14px; background: #fff; color: #0f172a; }
    .item { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .page { display: none; }
    .page.show { display: block; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #cbd5e1; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 4px; }
    .nav button { background: none; border: none; padding: 8px 4px; font-size: 12px; font-weight: bold; color: #475569; cursor: pointer; border-radius: 8px; }
    .nav button.active { background: #fef3c7; color: #0f172a; }
    .box { display: none; background: #fff; border: 2px solid #0f172a; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .box.open { display: block; }
    .num { font-size: 20px; font-weight: bold; margin-top: 4px; }
  </style>
</head>
<body>

  <header>
    <h1>🚚 Mor self drive</h1>
    <button class="btn btn-light" onclick="toggleBox('boxSettings')">⚙️ Settings</button>
  </header>

  <div class="wrap">
    <!-- SETTINGS BOX -->
    <div id="boxSettings" class="box">
      <h3 style="margin-bottom:10px;">Settings & Data</h3>
      <div class="grid2" style="margin-bottom:10px;">
        <button class="btn btn-green" onclick="exportJSON()">⬇ Backup JSON</button>
        <button class="btn btn-red" onclick="resetData()">🗑 Reset All</button>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Restore Backup (.json)</label>
        <input type="file" accept=".json" onchange="importJSON(event)" />
      </div>
    </div>

    <!-- ADD TRIP BOX -->
    <div id="boxTrip" class="box">
      <h3 style="margin-bottom:10px;">Nayi Trip / Hisab</h3>
      <div class="field"><label>Date</label><input type="date" id="inDate" /></div>
      <div class="field"><label>Gaadi Number</label><input type="text" id="inVeh" placeholder="HR-10-AB-1234" /></div>
      <div class="field"><label>Party Name</label><input type="text" id="inParty" placeholder="Customer / Party" /></div>
      <div class="grid2">
        <div class="field"><label>Kamai (₹)</label><input type="number" id="inInc" placeholder="0" /></div>
        <div class="field"><label>Kharcha (₹)</label><input type="number" id="inExp" placeholder="0" /></div>
      </div>
      <div class="field"><label>Jama Mila (₹)</label><input type="number" id="inPaid" placeholder="0" /></div>
      <div class="grid2">
        <button class="btn btn-dark" onclick="addTrip()">Save Entry</button>
        <button class="btn btn-light" onclick="closeBoxes()">Band Karein</button>
      </div>
    </div>

    <!-- ADD VEHICLE BOX -->
    <div id="boxVeh" class="box">
      <h3 style="margin-bottom:10px;">Nayi Gaadi</h3>
      <div class="field"><label>Gaadi Number</label><input type="text" id="vNo" placeholder="HR-10-XX-0000" /></div>
      <div class="field"><label>Model</label><input type="text" id="vMod" placeholder="Swift / Bolero" /></div>
      <div class="field">
        <label>Status</label>
        <select id="vSt">
          <option value="Available">Available</option>
          <option value="On Trip">On Trip</option>
          <option value="Maintenance">Maintenance</option>
        </select>
      </div>
      <div class="grid2">
        <button class="btn btn-dark" onclick="addVeh()">Save Gaadi</button>
        <button class="btn btn-light" onclick="closeBoxes()">Band Karein</button>
      </div>
    </div>

    <!-- HOME PAGE -->
    <div id="page-home" class="page show">
      <div class="card dark-card">
        <div style="font-size:12px;color:#cbd5e1;">AAJ KA HISAB (<span id="lblToday"></span>)</div>
        <div class="num" style="font-size:24px;margin:8px 0 12px;">Kamai: ₹<span id="sTodayInc">0</span> | Bachat: ₹<span id="sTodayProf">0</span></div>
        <div class="grid2">
          <button class="btn btn-amber" onclick="openTripBox()">+ Nayi Trip</button>
          <button class="btn btn-light" onclick="openVehBox()">+ Gaadi Jodein</button>
        </div>
      </div>

      <div class="grid2">
        <div class="card"><div style="font-size:12px;color:#475569;">Total Kamai</div><div class="num">₹<span id="sTotInc">0</span></div></div>
        <div class="card"><div style="font-size:12px;color:#475569;">Total Kharcha</div><div class="num" style="color:#dc2626;">₹<span id="sTotExp">0</span></div></div>
        <div class="card"><div style="font-size:12px;color:#475569;">Net Bachat</div><div class="num" style="color:#059669;">₹<span id="sNet">0</span></div></div>
        <div class="card"><div style="font-size:12px;color:#475569;">Market Udhaar</div><div class="num" style="color:#b45309;">₹<span id="sDue">0</span></div></div>
      </div>
    </div>

    <!-- FLEET PAGE -->
    <div id="page-fleet" class="page">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3>Apni Gaadiyan</h3>
        <button class="btn btn-dark" onclick="openVehBox()">+ Gaadi</button>
      </div>
      <div id="listVeh"></div>
    </div>

    <!-- HISAB PAGE -->
    <div id="page-hisab" class="page">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3>Trip & Hisab</h3>
        <button class="btn btn-amber" onclick="openTripBox()">+ Trip</button>
      </div>
      <div id="listTrip"></div>
    </div>

    <!-- CUSTOMERS PAGE -->
    <div id="page-party" class="page">
      <h3 style="margin-bottom:10px;">Party Khata</h3>
      <div id="listParty"></div>
    </div>
  </div>

  <div class="nav">
    <button id="tab-home" class="active" onclick="goPage('home')">🏠 Home</button>
    <button id="tab-fleet" onclick="goPage('fleet')">🚚 Gaadiyan</button>
    <button id="tab-hisab" onclick="goPage('hisab')">📒 Hisab</button>
    <button id="tab-party" onclick="goPage('party')">👥 Khata</button>
  </div>

  <script>
    var KEY = 'mor_simple_v1';
    var data = { vehicles: [], trips: [] };
    try {
      var saved = JSON.parse(localStorage.getItem(KEY));
      if (saved) data = saved;
    } catch (e) {}

    function save() {
      localStorage.setItem(KEY, JSON.stringify(data));
      render();
    }

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function closeBoxes() {
      var boxes = document.querySelectorAll('.box');
      for (var i = 0; i < boxes.length; i++) boxes[i].classList.remove('open');
    }

    function toggleBox(id) {
      var el = document.getElementById(id);
      var wasOpen = el.classList.contains('open');
      closeBoxes();
      if (!wasOpen) el.classList.add('open');
    }

    function openTripBox() {
      closeBoxes();
      document.getElementById('inDate').value = todayStr();
      document.getElementById('boxTrip').classList.add('open');
    }

    function openVehBox() {
      closeBoxes();
      document.getElementById('boxVeh').classList.add('open');
    }

    function goPage(name) {
      closeBoxes();
      var pages = document.querySelectorAll('.page');
      for (var i = 0; i < pages.length; i++) pages[i].classList.remove('show');
      var tabs = document.querySelectorAll('.nav button');
      for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active');
      document.getElementById('page-' + name).classList.add('show');
      document.getElementById('tab-' + name).classList.add('active');
    }

    function addVeh() {
      var no = document.getElementById('vNo').value.trim().toUpperCase();
      var mod = document.getElementById('vMod').value.trim() || 'Vehicle';
      var st = document.getElementById('vSt').value;
      if (!no) return alert('Gaadi number likhein');
      data.vehicles.push({ id: Date.now(), no: no, mod: mod, st: st });
      document.getElementById('vNo').value = '';
      document.getElementById('vMod').value = '';
      closeBoxes();
      save();
    }

    function delVeh(id) {
      if (!confirm('Gaadi hatayein?')) return;
      data.vehicles = data.vehicles.filter(function(x) { return x.id !== id; });
      save();
    }

    function addTrip() {
      var dt = document.getElementById('inDate').value || todayStr();
      var veh = document.getElementById('inVeh').value.trim().toUpperCase() || '-';
      var party = document.getElementById('inParty').value.trim() || 'Cash';
      var inc = Number(document.getElementById('inInc').value) || 0;
      var exp = Number(document.getElementById('inExp').value) || 0;
      var paid = Number(document.getElementById('inPaid').value) || 0;
      data.trips.unshift({ id: Date.now(), dt: dt, veh: veh, party: party, inc: inc, exp: exp, paid: paid });
      document.getElementById('inVeh').value = '';
      document.getElementById('inParty').value = '';
      document.getElementById('inInc').value = '';
      document.getElementById('inExp').value = '';
      document.getElementById('inPaid').value = '';
      closeBoxes();
      save();
    }

    function delTrip(id) {
      if (!confirm('Entry delete karein?')) return;
      data.trips = data.trips.filter(function(x) { return x.id !== id; });
      save();
    }

    function resetData() {
      if (!confirm('Saara data delete karein?')) return;
      data = { vehicles: [], trips: [] };
      closeBoxes();
      save();
    }

    function exportJSON() {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mor-self-drive-' + todayStr() + '.json';
      a.click();
    }

    function importJSON(ev) {
      var f = ev.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function() {
        try {
          var p = JSON.parse(r.result);
          data = { vehicles: p.vehicles || [], trips: p.trips || [] };
          closeBoxes();
          save();
          alert('Backup load ho gaya');
        } catch (err) {
          alert('Galat file');
        }
      };
      r.readAsText(f);
    }

    function render() {
      var td = todayStr();
      document.getElementById('lblToday').textContent = td;

      var tInc = 0, tExp = 0, inc = 0, exp = 0, paid = 0;
      var parties = {};

      for (var i = 0; i < data.trips.length; i++) {
        var x = data.trips[i];
        inc += x.inc;
        exp += x.exp;
        paid += x.paid;
        if (x.dt === td) {
          tInc += x.inc;
          tExp += x.exp;
        }
        var k = x.party.toLowerCase();
        if (!parties[k]) parties[k] = { name: x.party, bill: 0, paid: 0 };
        parties[k].bill += x.inc;
        parties[k].paid += x.paid;
      }

      document.getElementById('sTodayInc').textContent = tInc;
      document.getElementById('sTodayProf').textContent = (tInc - tExp);
      document.getElementById('sTotInc').textContent = inc;
      document.getElementById('sTotExp').textContent = exp;
      document.getElementById('sNet').textContent = (inc - exp);
      document.getElementById('sDue').textContent = Math.max(0, inc - paid);

      var vHtml = '';
      if (!data.vehicles.length) {
        vHtml = '<div class="card">Koi gaadi add nahi hai.</div>';
      } else {
        for (var v = 0; v < data.vehicles.length; v++) {
          var itemV = data.vehicles[v];
          vHtml += '<div class="item"><div><b>' + itemV.no + '</b><br><small>' + itemV.mod + ' • ' + itemV.st + '</small></div><button class="btn btn-red" onclick="delVeh(' + itemV.id + ')">X</button></div>';
        }
      }
      document.getElementById('listVeh').innerHTML = vHtml;

      var trHtml = '';
      if (!data.trips.length) {
        trHtml = '<div class="card">Koi trip entry nahi hai.</div>';
      } else {
        for (var t = 0; t < data.trips.length; t++) {
          var itemT = data.trips[t];
          trHtml += '<div class="item"><div><b>' + itemT.party + '</b> (' + itemT.veh + ')<br><small>' + itemT.dt + ' | Kamai: ₹' + itemT.inc + ' | Kharcha: ₹' + itemT.exp + '</small></div><button class="btn btn-red" onclick="delTrip(' + itemT.id + ')">X</button></div>';
        }
      }
      document.getElementById('listTrip').innerHTML = trHtml;

      var pHtml = '';
      var keys = Object.keys(parties);
      if (!keys.length) {
        pHtml = '<div class="card">Koi khata nahi hai.</div>';
      } else {
        for (var p = 0; p < keys.length; p++) {
          var pr = parties[keys[p]];
          var due = pr.bill - pr.paid;
          pHtml += '<div class="item"><div><b>' + pr.name + '</b><br><small>Bill: ₹' + pr.bill + ' | Jama: ₹' + pr.paid + '</small></div><b>' + (due > 0 ? 'Baaki: ₹' + due : 'Clear') + '</b></div>';
        }
      }
      document.getElementById('listParty').innerHTML = pHtml;
    }

    render();
  </script>
</body>
  </html>
